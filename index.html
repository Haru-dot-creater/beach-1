<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ビーチフラッグス スターター</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #f4f4f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      box-sizing: border-box;
    }

    .start-btn {
      width: 80vw;
      max-width: 400px;
      height: 80vw;
      max-height: 400px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(145deg, #ff4e50, #f9d423);
      color: white;
      font-size: clamp(2rem, 8vw, 3.5rem);
      font-weight: bold;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      cursor: pointer;
      outline: none;
      transition: transform 0.1s, box-shadow 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    .start-btn:active {
      transform: scale(0.95);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    .start-btn:disabled {
      background: #ccc;
      box-shadow: none;
      cursor: not-allowed;
    }

    #status {
      margin-top: 30px;
      font-size: 1.5rem;
      color: #333;
      height: 2em;
      text-align: center;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <button id="startBtn" class="start-btn">START</button>
  <div id="status">READY</div>

  <script>
    const startBtn = document.getElementById('startBtn');
    const statusEl = document.getElementById('status');

    let audioCtx = null;

    // Web Audio APIの初期化（スマホの音声再生制限を解除する）
    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Web Audio APIでホイッスル音（ピー音）を生成・再生
    function playWhistle() {
      initAudio();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      // ホイッスルの周波数（約2500Hz〜3000Hz）
      osc.frequency.setValueAtTime(2800, audioCtx.currentTime);

      // 音量の調整（急激に小さくして歯切れよく）
      gain.gain.setValueAtTime(1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.8);
    }

    // 音声読み上げ関数（英語）
    function speak(text) {
      return new Promise((resolve) => {
        const uttr = new SpeechSynthesisUtterance(text);
        uttr.lang = 'en-US';
        uttr.rate = 1.0;

        uttr.onend = () => {
          resolve();
        };

        uttr.onerror = () => {
          resolve();
        };

        window.speechSynthesis.speak(uttr);
      });
    }

    // 非同期タイマー（指定ミリ秒待機）
    function delay(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    // メインのシーケンス
    startBtn.addEventListener('click', async () => {
      // ユーザー操作起点でオーディオをアンロック
      initAudio();
      
      // スマホのSpeechSynthesis対策：ダミーで空音声を一瞬発声させてアンロック
      window.speechSynthesis.cancel();
      const dummyUtterance = new SpeechSynthesisUtterance('');
      window.speechSynthesis.speak(dummyUtterance);

      startBtn.disabled = true;
      statusEl.textContent = "10秒カウントダウン中...";

      // 1. スタートボタン押下後 10秒待機
      await delay(10000);

      // 2. "Competitors ready"
      statusEl.textContent = "Competitors ready";
      await speak("Competitors ready");

      // 声が終わってから明確に間隔を空ける (0.8秒)
      await delay(800);

      // 3. "Heads down"
      statusEl.textContent = "Heads down";
      await speak("Heads down");

      // 4. ランダム時間（1.0秒 〜 2.5秒）の経過
      statusEl.textContent = "WAIT...";
      const randomDelay = Math.floor(Math.random() * 1500) + 1000;
      await delay(randomDelay);

      // 5. ホイッスル
      statusEl.textContent = "BANG !";
      playWhistle();

      // リセット
      await delay(1000);
      statusEl.textContent = "READY";
      startBtn.disabled = false;
    });
  </script>
</body>
</html>
