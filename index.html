<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BEACH FLAGS - START SIGNAL SYSTEM</title>

  <!-- PWA設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BeachFlags">

  <style>
    :root {
      /* デフォルトカラー（ブルー） */
      --primary-color: #2563eb;
      --primary-dark: #1e40af;
      --primary-light: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.4);
      --btn-shadow: rgba(37, 99, 235, 0.6);
    }

    [data-theme="green"] {
      --primary-color: #059669;
      --primary-dark: #065f46;
      --primary-light: #34d399;
      --primary-glow: rgba(52, 211, 153, 0.4);
      --btn-shadow: rgba(5, 150, 105, 0.6);
    }

    [data-theme="red"] {
      --primary-color: #dc2626;
      --primary-dark: #991b1b;
      --primary-light: #f87171;
      --primary-glow: rgba(248, 113, 113, 0.4);
      --btn-shadow: rgba(220, 38, 38, 0.6);
    }

    [data-theme="purple"] {
      --primary-color: #7c3aed;
      --primary-dark: #5b21b6;
      --primary-light: #c084fc;
      --primary-glow: rgba(192, 132, 252, 0.4);
      --btn-shadow: rgba(124, 58, 237, 0.6);
    }

    [data-theme="orange"] {
      --primary-color: #ea580c;
      --primary-dark: #9a3412;
      --primary-light: #fb923c;
      --primary-glow: rgba(251, 146, 60, 0.4);
      --btn-shadow: rgba(234, 88, 12, 0.6);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      text-align: center;
      overflow: hidden;
      position: relative;
    }

    /* 設定ボタン（右上） */
    .settings-toggle-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #f8fafc;
      font-size: 1.5rem;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background 0.2s;
      z-index: 10;
    }

    .settings-toggle-btn:active {
      background: rgba(255, 255, 255, 0.25);
    }

    /* カラー＆時間選択モーダルパネル */
    .color-panel {
      position: absolute;
      top: 65px;
      right: 15px;
      background: #1e293b;
      border: 1px solid #334155;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      display: none;
      flex-direction: column;
      gap: 14px;
      z-index: 20;
      width: 260px;
      text-align: left;
    }

    .color-panel.active {
      display: flex;
    }

    .panel-section-title {
      font-size: 0.8rem;
      color: #94a3b8;
      font-weight: bold;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    .color-options {
      display: flex;
      gap: 10px;
    }

    .color-dot {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
    }

    .color-dot:active {
      transform: scale(0.9);
    }

    .color-dot.selected {
      border-color: #ffffff;
      transform: scale(1.1);
    }

    .dot-blue { background: #2563eb; }
    .dot-green { background: #059669; }
    .dot-red { background: #dc2626; }
    .dot-purple { background: #7c3aed; }
    .dot-orange { background: #ea580c; }

    /* カウントダウン時間ボタン群 */
    .time-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .time-btn {
      background: #334155;
      border: 1px solid #475569;
      color: #f1f5f9;
      padding: 6px 0;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }

    .time-btn.selected {
      background: var(--primary-color);
      border-color: var(--primary-light);
      color: #ffffff;
      box-shadow: 0 0 8px var(--primary-glow);
    }

    /* ヘッダーエリア */
    .header {
      margin-top: 35px;
    }

    .header h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 900;
      letter-spacing: 0.1em;
      color: var(--primary-light);
      text-shadow: 0 0 20px var(--primary-glow);
      transition: color 0.3s, text-shadow 0.3s;
    }

    .header p {
      margin: 5px 0 0 0;
      font-size: clamp(0.8rem, 2.5vw, 1.1rem);
      font-weight: 600;
      letter-spacing: 0.2em;
      color: #94a3b8;
    }

    /* メインボタンエリア */
    .main-container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-grow: 1;
      width: 100%;
    }

    .start-btn {
      width: 70vw;
      max-width: 340px;
      height: 70vw;
      max-height: 340px;
      border-radius: 50%;
      border: 4px solid var(--primary-light);
      background: radial-gradient(circle, var(--primary-light) 0%, var(--primary-color) 70%, var(--primary-dark) 100%);
      color: #ffffff;
      font-size: clamp(2.2rem, 7vw, 3.5rem);
      font-weight: 800;
      letter-spacing: 0.05em;
      box-shadow: 0 0 35px var(--btn-shadow), inset 0 4px 8px rgba(255, 255, 255, 0.3);
      cursor: pointer;
      outline: none;
      transition: transform 0.15s ease-out, background 0.3s, border-color 0.3s, box-shadow 0.3s;
      -webkit-tap-highlight-color: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .start-btn:active {
      transform: scale(0.94);
      box-shadow: 0 0 15px var(--btn-shadow), inset 0 2px 4px rgba(0, 0, 0, 0.4);
    }

    .start-btn:disabled {
      background: #334155;
      border-color: #475569;
      color: #64748b;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    /* ステータス表示エリア */
    .footer-status {
      margin-bottom: 30px;
      height: 90px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    #status {
      font-size: clamp(1.5rem, 5vw, 2.2rem);
      font-weight: 700;
      color: #f1f5f9;
      letter-spacing: 0.05em;
    }

    #subStatus {
      margin-top: 8px;
      font-size: clamp(1rem, 3.5vw, 1.4rem);
      font-weight: 600;
      color: var(--primary-light);
      height: 1.5em;
      transition: color 0.3s;
    }

    .go-text {
      color: #4ade80 !important;
      font-size: clamp(2.5rem, 8vw, 3.5rem) !important;
      text-shadow: 0 0 25px rgba(74, 222, 128, 0.6);
    }
  </style>
</head>
<body>

  <!-- 設定トグルボタン -->
  <button id="settingsBtn" class="settings-toggle-btn" aria-label="設定">⚙</button>

  <!-- カラー & カウントダウン時間 選択パネル -->
  <div id="colorPanel" class="color-panel">
    <div>
      <div class="panel-section-title">THEME COLOR</div>
      <div class="color-options">
        <div class="color-dot dot-blue selected" data-color="blue"></div>
        <div class="color-dot dot-green" data-color="green"></div>
        <div class="color-dot dot-red" data-color="red"></div>
        <div class="color-dot dot-purple" data-color="purple"></div>
        <div class="color-dot dot-orange" data-color="orange"></div>
      </div>
    </div>

    <div>
      <div class="panel-section-title">PRE-START TIMER</div>
      <div class="time-options">
        <button class="time-btn" data-time="10">10s</button>
        <button class="time-btn" data-time="20">20s</button>
        <button class="time-btn" data-time="30">30s</button>
        <button class="time-btn" data-time="40">40s</button>
        <button class="time-btn" data-time="50">50s</button>
        <button class="time-btn" data-time="60">60s</button>
      </div>
    </div>
  </div>

  <!-- ヘッダー -->
  <div class="header">
    <h1>BEACH FLAGS</h1>
    <p>START SIGNAL SYSTEM</p>
  </div>

  <!-- スタートボタン -->
  <div class="main-container">
    <button id="startBtn" class="start-btn">START</button>
  </div>

  <!-- ステータス表示 -->
  <div class="footer-status">
    <div id="status">READY</div>
    <div id="subStatus"></div>
  </div>

  <script>
    const startBtn = document.getElementById('startBtn');
    const statusEl = document.getElementById('status');
    const subStatusEl = document.getElementById('subStatus');
    const settingsBtn = document.getElementById('settingsBtn');
    const colorPanel = document.getElementById('colorPanel');
    const colorDots = document.querySelectorAll('.color-dot');
    const timeBtns = document.querySelectorAll('.time-btn');

    let audioCtx = null;
    let selectedTimerSeconds = 10; // デフォルト10秒

    // --- 設定＆テーマ処理 ---
    function setTheme(colorName) {
      if (colorName === 'blue') {
        document.documentElement.removeAttribute('data-theme');
      } else {
        document.documentElement.setAttribute('data-theme', colorName);
      }
      colorDots.forEach(dot => {
        dot.classList.toggle('selected', dot.dataset.color === colorName);
      });
      localStorage.setItem('beach_flags_theme', colorName);
    }

    function setTimerSetting(sec) {
      selectedTimerSeconds = parseInt(sec, 10);
      timeBtns.forEach(btn => {
        btn.classList.toggle('selected', parseInt(btn.dataset.time, 10) === selectedTimerSeconds);
      });
      localStorage.setItem('beach_flags_timer', selectedTimerSeconds);
    }

    // 保存設定の読み込み
    const savedTheme = localStorage.getItem('beach_flags_theme') || 'blue';
    const savedTimer = localStorage.getItem('beach_flags_timer') || '10';
    setTheme(savedTheme);
    setTimerSetting(savedTimer);

    // イベントリスナー
    settingsBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      colorPanel.classList.toggle('active');
    });

    colorDots.forEach(dot => {
      dot.addEventListener('click', () => {
        setTheme(dot.dataset.color);
      });
    });

    timeBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        setTimerSetting(btn.dataset.time);
      });
    });

    document.addEventListener('click', (e) => {
      if (!colorPanel.contains(e.target) && e.target !== settingsBtn) {
        colorPanel.classList.remove('active');
      }
    });

    // --- オーディオ制御系 ---
    function unlockAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      const buffer = audioCtx.createBuffer(1, 1, 22050);
      const source = audioCtx.createBufferSource();
      source.buffer = buffer;
      source.connect(audioCtx.destination);
      source.start(0);
    }

    // 10秒前の予告音（ピッ・ピッ・ピー）
    function playWarningBeeps() {
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const now = audioCtx.currentTime;

      // 短いピッ (1回目)
      createBeep(1800, now, 0.12);
      // 短いピッ (2回目)
      createBeep(1800, now + 0.35, 0.12);
      // 長めのピー (3回目)
      createBeep(2200, now + 0.7, 0.45);
    }

    // 1回分のビープ音生成
    function createBeep(freq, startTime, duration) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, startTime);

      gain.gain.setValueAtTime(0.4, startTime);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(startTime);
      osc.stop(startTime + duration);
    }

    // スタートホイッスル
    function playWhistle() {
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(2600, now);

      gain.gain.setValueAtTime(0.6, now);
      gain.gain.setValueAtTime(0.6, now + 0.6);
      gain.gain.linearRampToValueAtTime(0.001, now + 0.85);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 0.85);
    }

    function speak(text) {
      return new Promise((resolve) => {
        window.speechSynthesis.cancel();

        const uttr = new SpeechSynthesisUtterance(text);
        uttr.lang = 'en-US';
        uttr.rate = 1.0;

        let resolved = false;
        const done = () => {
          if (!resolved) {
            resolved = true;
            resolve();
          }
        };

        uttr.onend = done;
        uttr.onerror = done;
        setTimeout(done, 3000);

        window.speechSynthesis.speak(uttr);
      });
    }

    function delay(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function getRandomTime(minSec, maxSec) {
      return Math.floor((Math.random() * (maxSec - minSec) + minSec) * 1000);
    }

    // --- メインカウントダウンシーケンス ---
    startBtn.addEventListener('click', async () => {
      unlockAudio();

      window.speechSynthesis.cancel();
      const dummyUtterance = new SpeechSynthesisUtterance(' ');
      dummyUtterance.volume = 0;
      window.speechSynthesis.speak(dummyUtterance);

      startBtn.disabled = true;
      statusEl.className = "";
      
      let currentSeconds = selectedTimerSeconds;
      statusEl.textContent = `カウントダウン (${currentSeconds}s)`;

      // カウントダウン処理（1秒ごとのループ）
      for (let i = currentSeconds; i > 0; i--) {
        statusEl.textContent = `カウントダウン (${i}s)`;

        // 20秒以上の設定時、残り10秒のタイミングで「ピッ・ピッ・ピー」を鳴らす
        if (selectedTimerSeconds >= 20 && i === 10) {
          playWarningBeeps();
        }

        await delay(1000);
      }

      // 2. "Competitors ready"
      statusEl.textContent = "Competitors ready";
      await speak("Competitors ready");

      // 3. ランダム時間（0.6秒 〜 1.0秒）
      const readyToHeadsDelay = getRandomTime(0.6, 1.0);
      await delay(readyToHeadsDelay);

      // 4. "Heads down"
      statusEl.textContent = "Heads down";
      await speak("Heads down");

      // 5. ランダム時間（1.0秒 〜 2.5秒）を事前表示
      const randomDelayMs = getRandomTime(1.0, 2.5);
      const randomDelaySec = (randomDelayMs / 1000).toFixed(2);
      
      statusEl.textContent = "WAIT...";
      subStatusEl.textContent = `Random Delay: ${randomDelaySec}s`;

      await delay(randomDelayMs);

      // 6. ホイッスル & GO !
      statusEl.className = "go-text";
      statusEl.textContent = "GO !";
      subStatusEl.textContent = "";
      playWhistle();

      // リセット
      await delay(2000);
      statusEl.className = "";
      statusEl.textContent = "READY";
      startBtn.disabled = false;
    });
  </script>
</body>
</html>
