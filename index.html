<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BEACH FLAGS - START SIGNAL SYSTEM</title>

  <!-- アプリアイコンの設定 -->
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">

  <!-- PWA設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BeachFlags">

  <style>
    :root {
      --primary-color: #2563eb;
      --primary-dark: #1e40af;
      --primary-light: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.4);
      --btn-shadow: rgba(37, 99, 235, 0.6);
    }

    [data-theme="green"] {
      --primary-color: #059669;
      --primary-dark: #065f46;
      --primary-light: #34d399;
      --primary-glow: rgba(52, 211, 153, 0.4);
      --btn-shadow: rgba(5, 150, 105, 0.6);
    }

    [data-theme="red"] {
      --primary-color: #dc2626;
      --primary-dark: #991b1b;
      --primary-light: #f87171;
      --primary-glow: rgba(248, 113, 113, 0.4);
      --btn-shadow: rgba(220, 38, 38, 0.6);
    }

    [data-theme="purple"] {
      --primary-color: #7c3aed;
      --primary-dark: #5b21b6;
      --primary-light: #c084fc;
      --primary-glow: rgba(192, 132, 252, 0.4);
      --btn-shadow: rgba(124, 58, 237, 0.6);
    }

    [data-theme="orange"] {
      --primary-color: #ea580c;
      --primary-dark: #9a3412;
      --primary-light: #fb923c;
      --primary-glow: rgba(251, 146, 60, 0.4);
      --btn-shadow: rgba(234, 88, 12, 0.6);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      text-align: center;
      overflow: hidden;
      position: relative;
    }

    .settings-toggle-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #f8fafc;
      font-size: 1.5rem;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background 0.2s;
      z-index: 10;
    }

    .settings-toggle-btn:active { background: rgba(255, 255, 255, 0.25); }

    .color-panel {
      position: absolute;
      top: 65px;
      right: 15px;
      background: #1e293b;
      border: 1px solid #334155;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      display: none;
      flex-direction: column;
      gap: 14px;
      z-index: 20;
      width: 260px;
      text-align: left;
    }

    .color-panel.active { display: flex; }

    .panel-section-title {
      font-size: 0.8rem;
      color: #94a3b8;
      font-weight: bold;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    .color-options { display: flex; gap: 10px; }

    .color-dot {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
    }

    .color-dot:active { transform: scale(0.9); }
    .color-dot.selected { border-color: #ffffff; transform: scale(1.1); }

    .dot-blue { background: #2563eb; }
    .dot-green { background: #059669; }
    .dot-red { background: #dc2626; }
    .dot-purple { background: #7c3aed; }
    .dot-orange { background: #ea580c; }

    .time-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .time-btn {
      background: #334155;
      border: 1px solid #475569;
      color: #f1f5f9;
      padding: 6px 0;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }

    .time-btn.selected {
      background: var(--primary-color);
      border-color: var(--primary-light);
      color: #ffffff;
      box-shadow: 0 0 8px var(--primary-glow);
    }

    .header { margin-top: 35px; }

    .header h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 900;
      letter-spacing: 0.1em;
      color: var(--primary-light);
      text-shadow: 0 0 20px var(--primary-glow);
      transition: color 0.3s, text-shadow 0.3s;
    }

    .header p {
      margin: 5px 0 0 0;
      font-size: clamp(0.8rem, 2.5vw, 1.1rem);
      font-weight: 600;
      letter-spacing: 0.2em;
      color: #94a3b8;
    }

    .main-container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-grow: 1;
      width: 100%;
    }

    .start-btn {
      width: 70vw;
      max-width: 340px;
      height: 70vw;
      max-height: 340px;
      border-radius: 50%;
      border: 4px solid var(--primary-light);
      background: radial-gradient(circle, var(--primary-light) 0%, var(--primary-color) 70%, var(--primary-dark) 100%);
      color: #ffffff;
      font-size: clamp(2.2rem, 7vw, 3.5rem);
      font-weight: 800;
      letter-spacing: 0.05em;
      box-shadow: 0 0 35px var(--btn-shadow), inset 0 4px 8px rgba(255, 255, 255, 0.3);
      cursor: pointer;
      outline: none;
      transition: transform 0.15s ease-out, background 0.3s, border-color 0.3s, box-shadow 0.3s;
      -webkit-tap-highlight-color: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .start-btn:active {
      transform: scale(0.94);
      box-shadow: 0 0 15px var(--btn-shadow), inset 0 2px 4px rgba(0, 0, 0, 0.4);
    }

    .start-btn:disabled {
      background: #334155;
      border-color: #475569;
      color: #64748b;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    .footer-status {
      margin-bottom: 30px;
      height: 90px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    #status {
      font-size: clamp(1.5rem, 5vw, 2.2rem);
      font-weight: 700;
      color: #f1f5f9;
      letter-spacing: 0.05em;
    }

    #subStatus {
      margin-top: 8px;
      font-size: clamp(1rem, 3.5vw, 1.4rem);
      font-weight: 600;
      color: var(--primary-light);
      height: 1.5em;
      transition: color 0.3s;
    }

    .go-text {
      color: #4ade80 !important;
      font-size: clamp(2.5rem, 8vw, 3.5rem) !important;
      text-shadow: 0 0 25px rgba(74, 222, 128, 0.6);
    }
  </style>
</head>
<body>

  <button id="settingsBtn" class="settings-toggle-btn" aria-label="設定">⚙</button>

  <div id="colorPanel" class="color-panel">
    <div>
      <div class="panel-section-title">THEME COLOR</div>
      <div class="color-options">
        <div class="color-dot dot-blue selected" data-color="blue"></div>
        <div class="color-dot dot-green" data-color="green"></div>
        <div class="color-dot dot-red" data-color="red"></div>
        <div class="color-dot dot-purple" data-color="purple"></div>
        <div class="color-dot dot-orange" data-color="orange"></div>
      </div>
    </div>

    <div>
      <div class="panel-section-title">PRE-START TIMER</div>
      <div class="time-options">
        <button class="time-btn" data-time="10">10s</button>
        <button class="time-btn" data-time="20">20s</button>
        <button class="time-btn" data-time="30">30s</button>
        <button class="time-btn" data-time="40">40s</button>
        <button class="time-btn" data-time="50">50s</button>
        <button class="time-btn" data-time="60">60s</button>
      </div>
    </div>
  </div>

  <div class="header">
    <h1>BEACH FLAGS</h1>
    <p>START SIGNAL SYSTEM</p>
  </div>

  <div class="main-container">
    <button id="startBtn" class="start-btn">START</button>
  </div>

  <div class="footer-status">
    <div id="status">READY</div>
    <div id="subStatus"></div>
  </div>

  <script>
    const startBtn = document.getElementById('startBtn');
    const statusEl = document.getElementById('status');
    const subStatusEl = document.getElementById('subStatus');
    const settingsBtn = document.getElementById('settingsBtn');
    const colorPanel = document.getElementById('colorPanel');
    const colorDots = document.querySelectorAll('.color-dot');
    const timeBtns = document.querySelectorAll('.time-btn');

    let selectedTimerSeconds = 10;
