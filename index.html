<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ビーチフラッグス スターター</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #f4f4f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      box-sizing: border-box;
    }

    .start-btn {
      width: 80vw;
      max-width: 400px;
      height: 80vw;
      max-height: 400px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(145deg, #ff4e50, #f9d423);
      color: white;
      font-size: clamp(2rem, 8vw, 3.5rem);
      font-weight: bold;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      cursor: pointer;
      outline: none;
      transition: transform 0.1s, box-shadow 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    .start-btn:active {
      transform: scale(0.95);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    .start-btn:disabled {
      background: #ccc;
      box-shadow: none;
      cursor: not-allowed;
    }

    #status {
      margin-top: 30px;
      font-size: 1.5rem;
      color: #333;
      height: 2em;
      text-align: center;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <button id="startBtn" class="start-btn">START</button>
  <div id="status">READY</div>

  <script>
    const startBtn = document.getElementById('startBtn');
    const statusEl = document.getElementById('status');

    let audioCtx = null;

    // ボタン押下時に必ず呼ぶ：スマホのWeb Audio APIを強力にアンロック
    function unlockAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      // ★重要：タップした瞬間に「無音」の音声を1ミリ秒だけ実際に再生してブラウザの制限を完全に解除
      const buffer = audioCtx.createBuffer(1, 1, 22050);
      const source = audioCtx.createBufferSource();
      source.buffer = buffer;
      source.connect(audioCtx.destination);
      source.start(0);
    }

    // ホイッスル音再生
    function playWhistle() {
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      // ピーッと通る高音（2400Hz）
      osc.frequency.setValueAtTime(2400, now);

      // 音量の減衰設定（スマホスピーカーで割れないよう安全な音量設定）
      gain.gain.setValueAtTime(0.5, now);
      gain.gain.setValueAtTime(0.5, now + 0.6);
      gain.gain.linearRampToValueAtTime(0.001, now + 0.8);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 0.8);
    }

    // 音声読み上げ関数（英語）
    function speak(text) {
      return new Promise((resolve) => {
        // 音声認識/再生のバグを防ぐため一旦キャンセル
        window.speechSynthesis.cancel();

        const uttr = new SpeechSynthesisUtterance(text);
        uttr.lang = 'en-US';
        uttr.rate = 1.0;

        let resolved = false;
        const done = () => {
          if (!resolved) {
            resolved = true;
            resolve();
          }
        };

        uttr.onend = done;
        uttr.onerror = done;

        // スマホでonendが呼ばれない場合のセーフティタイマー（3秒で強制進行）
        setTimeout(done, 3000);

        window.speechSynthesis.speak(uttr);
      });
    }

    function delay(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    startBtn.addEventListener('click', async () => {
      // ユーザーのタップアクション直下にアンロック処理を確実に実行
      unlockAudio();

      // SpeechSynthesisのアンロック
      window.speechSynthesis.cancel();
      const dummyUtterance = new SpeechSynthesisUtterance(' ');
      dummyUtterance.volume = 0;
      window.speechSynthesis.speak(dummyUtterance);

      startBtn.disabled = true;
      statusEl.textContent = "10秒カウントダウン中...";

      // 1. スタート後 10秒待機
      await delay(10000);

      // 2. "Competitors ready"
      statusEl.textContent = "Competitors ready";
      await speak("Competitors ready");

      await delay(800);

      // 3. "Heads down"
      statusEl.textContent = "Heads down";
      await speak("Heads down");

      // 4. ランダム時間（1.0秒 〜 2.5秒）
      statusEl.textContent = "WAIT...";
      const randomDelay = Math.floor(Math.random() * 1500) + 1000;
      await delay(randomDelay);

      // 5. ホイッスル
      statusEl.textContent = "BANG !";
      playWhistle();

      // リセット
      await delay(1500);
      statusEl.textContent = "READY";
      startBtn.disabled = false;
    });
  </script>
</body>
</html>
